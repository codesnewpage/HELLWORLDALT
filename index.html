<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hola fuckers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0710;
    --bg2:#1a0f2b;
    --purple:#8b5cf6;
    --purple-dark:#4b2e83;
    --body-fill:#6b3fa0;
    --head-fill:#7c4dbd;
    --pink:#ff2d6d;
    --text:#f3ecff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:var(--bg);
  }
  body{
    background:radial-gradient(circle at 50% 32%, var(--bg2), var(--bg) 72%);
    font-family:'Poppins',sans-serif;
    color:var(--text);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    text-align:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
  }
  
  .stage{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:5.2rem;
    width:100%;
  }
  
  /* NUEVO: Contenedor que abraza el texto y a la araña para calcular medidas exactas */
  .greeting-container {
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%) scale(.85);
    opacity:0;
    transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
    display:inline-block;
    white-space:nowrap;
  }
  .stage.said .greeting-container {
    opacity:1;
    transform:translate(-50%, -50%) scale(1);
  }
  
  h1{
    font-family:'Metal Mania',cursive;
    font-weight:400;
    font-size:clamp(2.1rem,10vw,4.3rem);
    color:var(--pink);
    text-shadow:0 0 12px rgba(255,45,109,.8), 0 0 34px rgba(139,92,246,.55), 0 0 70px rgba(75,46,131,.5);
    margin:0;
    letter-spacing:1px;
    line-height:1.15;
    position:relative;
    z-index:2;
  }
  h1.flicker{ animation:flicker 5s infinite ease-in-out; }
  
  .greet-btn{
    font-family:'Metal Mania',cursive;
    font-size:1.35rem;
    letter-spacing:1px;
    color:var(--pink);
    background:rgba(139,92,246,.12);
    border:2px solid var(--purple);
    border-radius:10px;
    padding:.7rem 1.9rem;
    cursor:pointer;
    box-shadow:0 0 16px rgba(139,92,246,.45);
    -webkit-tap-highlight-color:transparent;
    transition:opacity .4s ease, transform .4s ease, box-shadow .4s ease;
    position:relative;
    z-index:2;
  }
  .greet-btn:active{ transform:scale(.95); box-shadow:0 0 22px rgba(255,45,109,.55); }
  .stage.said .greet-btn{ opacity:0; transform:scale(.85); pointer-events:none; }
  
  @keyframes flicker{
    0%,18%,22%,25%,53%,57%,100%{ opacity:1; }
    20%,24%,55%{ opacity:.5; }
  }
  
  .web{ position:absolute; width:26vw; max-width:140px; opacity:.18; pointer-events:none; }
  .web.tl{ top:0; left:0; }
  .web.tr{ top:0; right:0; transform:scaleX(-1); }
  
  .spider{
    position:absolute;
    top:0;
    left:0;
    width:58px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));
    pointer-events:none; 
  }
  
  .spider.s2{ width:44px; opacity:.85; }
  .spider.s3{ width:34px; opacity:.7;  }
  
  /* =========================================
     LA ARAÑA 4 (TOTALMENTE MEJORADA)
     ========================================= */
  .s4-wrapper {
    position: absolute;
    top: -10px; /* Al ras de las letras */
    left: -15px;
    width: 2px;
    height: 0;
    opacity: 0;
    z-index: 10;
  }
  .stage.said .s4-wrapper {
    /* Controla el recorrido horizontal exacto y la caída de la telaraña */
    animation: walkAndDropWrapper 12s linear infinite;
    animation-delay: 1.5s;
  }
  
  .s4-thread {
    width: 1px;
    height: 100%;
    background: rgba(201, 182, 255, 0.7);
    margin: 0 auto;
  }

  .s4-bouncer {
    position: absolute;
    bottom: -35px; /* Amarra la araña a la punta de la telaraña */
    left: 50%;
    margin-left: -22px; 
    width: 44px;
  }
  .stage.said .s4-bouncer {
    /* Simula los pasos subiendo y bajando */
    animation: s4Bounce 12s linear infinite;
    animation-delay: 1.5s;
  }

  .spider.s4 {
    width: 100%;
    position: static; 
    margin: 0;
    animation-name: none; 
  }
  .stage.said .spider.s4 {
    /* Gira a la araña para caminar o caer */
    animation: s4Turn 12s linear infinite;
    animation-delay: 1.5s;
  }

  /* Animación Horizontal y Caída FÍSICA */
  @keyframes walkAndDropWrapper {
    0%, 5%   { left: -15px; opacity: 0; height: 0; }
    10%      { left: -15px; opacity: 1; height: 0; }
    50%      { left: calc(100% - 10px); opacity: 1; height: 0; } /* Termina el texto exacto */
    55%      { left: calc(100% - 10px); opacity: 1; height: 0; } /* Pausa al final */
    85%      { left: calc(100% - 10px); opacity: 1; height: 100vh; } /* Baja fuera de pantalla */
    90%, 100%{ left: calc(100% - 10px); opacity: 0; height: 100vh; }
  }

  /* Rotación */
  @keyframes s4Turn {
    0%, 48%   { transform: rotate(90deg); } /* Mira a la derecha */
    52%, 100% { transform: rotate(180deg); } /* Mira hacia abajo */
  }

  /* Animación de Caminata Letra por Letra (12 rebotes) */
  @keyframes s4Bounce {
    0%, 10% { transform: translateY(0); }
    11.6% { transform: translateY(-7px); } 13.3% { transform: translateY(0); }
    15.0% { transform: translateY(-7px); } 16.6% { transform: translateY(0); }
    18.3% { transform: translateY(-7px); } 20.0% { transform: translateY(0); }
    21.6% { transform: translateY(-7px); } 23.3% { transform: translateY(0); }
    25.0% { transform: translateY(-7px); } 26.6% { transform: translateY(0); }
    28.3% { transform: translateY(-7px); } 30.0% { transform: translateY(0); }
    31.6% { transform: translateY(-7px); } 33.3% { transform: translateY(0); }
    35.0% { transform: translateY(-7px); } 36.6% { transform: translateY(0); }
    38.3% { transform: translateY(-7px); } 40.0% { transform: translateY(0); }
    41.6% { transform: translateY(-7px); } 43.3% { transform: translateY(0); }
    45.0% { transform: translateY(-7px); } 46.6% { transform: translateY(0); }
    48.3% { transform: translateY(-7px); } 50.0% { transform: translateY(0); }
    51%, 100% { transform: translateY(0); } /* Deja de brincar mientras cae */
  }

  /* Animación de patas y corazón */
  .leg{ transform-origin:50% 15%; animation:wiggleA .45s ease-in-out infinite alternate; }
  .leg2{ transform-origin:50% 15%; animation:wiggleB .45s ease-in-out infinite alternate; }
  @keyframes wiggleA{ from{ transform:rotate(-8deg);} to{ transform:rotate(4deg);} }
  @keyframes wiggleB{ from{ transform:rotate(8deg);} to{ transform:rotate(-4deg);} }
  .heart{ animation:pulse 1.1s ease-in-out infinite; transform-origin:50% 55%; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.16);} }
  
  @media (max-width:380px){
    .spider.s1{ width:46px; }
    .spider.s2{ width:36px; }
    .spider.s3{ width:28px; }
  }
</style>
</head>
<body>

  <svg class="web tl" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M0,0 L100,100 M0,25 Q25,25 25,0 M0,50 Q50,50 50,0 M0,75 Q75,75 75,0" stroke="#c9b6ff" fill="none" stroke-width="1"/>
  </svg>
  <svg class="web tr" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M0,0 L100,100 M0,25 Q25,25 25,0 M0,50 Q50,50 50,0 M0,75 Q75,75 75,0" stroke="#c9b6ff" fill="none" stroke-width="1"/>
  </svg>

  <div class="stage">
    <button id="greetBtn" class="greet-btn" type="button">saluda</button>
    
    <!-- NUEVO: Contenedor que unifica las letras con la araña s4 -->
    <div class="greeting-container">
      <h1 id="greeting" aria-live="polite">hola fuckers</h1>
      
      <!-- Araña 4 que camina las letras y desciende -->
      <div class="s4-wrapper">
        <div class="s4-thread"></div>
        <div class="s4-bouncer">
          <svg class="spider s4" viewBox="0 0 100 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g stroke="var(--purple-dark)" stroke-width="3.2" fill="none" stroke-linecap="round">
              <path class="leg"  d="M35 34 L14 14"/>
              <path class="leg2" d="M34 40 L8 40"/>
              <path class="leg"  d="M35 46 L14 64"/>
              <path class="leg2" d="M65 34 L86 14"/>
              <path class="leg"  d="M66 40 L92 40"/>
              <path class="leg2" d="M65 46 L86 64"/>
            </g>
            <ellipse cx="50" cy="43" rx="21" ry="17" fill="var(--body-fill)"/>
            <circle cx="50" cy="23" r="13.5" fill="var(--head-fill)"/>
            <path d="M39 12 L36 4 M45.5 9.5 L44.5 1.5 M54.5 9.5 L55.5 1.5 M61 12 L64 4"
                  stroke="var(--purple-dark)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="44.5" cy="22.5" r="3.4" fill="#fff"/>
            <circle cx="55.5" cy="22.5" r="3.4" fill="#fff"/>
            <circle cx="44.5" cy="23.5" r="1.7" fill="#160d24"/>
            <circle cx="55.5" cy="23.5" r="1.7" fill="#160d24"/>
            <path class="heart" fill="var(--pink)"
                  d="M50 54 C45.5 47.5 32 49.5 32 59 C32 68 50 76 50 76 C50 76 68 68 68 59 C68 49.5 54.5 47.5 50 54 Z"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Arañas libres (Caminarán aleatoriamente usando JS) -->
  <svg class="spider wanderer s1" viewBox="0 0 100 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g stroke="var(--purple-dark)" stroke-width="3.2" fill="none" stroke-linecap="round">
      <path class="leg"  d="M35 34 L14 14"/>
      <path class="leg2" d="M34 40 L8 40"/>
      <path class="leg"  d="M35 46 L14 64"/>
      <path class="leg2" d="M65 34 L86 14"/>
      <path class="leg"  d="M66 40 L92 40"/>
      <path class="leg2" d="M65 46 L86 64"/>
    </g>
    <ellipse cx="50" cy="43" rx="21" ry="17" fill="var(--body-fill)"/>
    <circle cx="50" cy="23" r="13.5" fill="var(--head-fill)"/>
    <path d="M39 12 L36 4 M45.5 9.5 L44.5 1.5 M54.5 9.5 L55.5 1.5 M61 12 L64 4"
          stroke="var(--purple-dark)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="44.5" cy="22.5" r="3.4" fill="#fff"/>
    <circle cx="55.5" cy="22.5" r="3.4" fill="#fff"/>
    <circle cx="44.5" cy="23.5" r="1.7" fill="#160d24"/>
    <circle cx="55.5" cy="23.5" r="1.7" fill="#160d24"/>
    <path class="heart" fill="var(--pink)"
          d="M50 54 C45.5 47.5 32 49.5 32 59 C32 68 50 76 50 76 C50 76 68 68 68 59 C68 49.5 54.5 47.5 50 54 Z"/>
  </svg>

  <svg class="spider wanderer s2" viewBox="0 0 100 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g stroke="var(--purple-dark)" stroke-width="3.2" fill="none" stroke-linecap="round">
      <path class="leg"  d="M35 34 L14 14"/>
      <path class="leg2" d="M34 40 L8 40"/>
      <path class="leg"  d="M35 46 L14 64"/>
      <path class="leg2" d="M65 34 L86 14"/>
      <path class="leg"  d="M66 40 L92 40"/>
      <path class="leg2" d="M65 46 L86 64"/>
    </g>
    <ellipse cx="50" cy="43" rx="21" ry="17" fill="var(--body-fill)"/>
    <circle cx="50" cy="23" r="13.5" fill="var(--head-fill)"/>
    <path d="M39 12 L36 4 M45.5 9.5 L44.5 1.5 M54.5 9.5 L55.5 1.5 M61 12 L64 4"
          stroke="var(--purple-dark)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="44.5" cy="22.5" r="3.4" fill="#fff"/>
    <circle cx="55.5" cy="22.5" r="3.4" fill="#fff"/>
    <circle cx="44.5" cy="23.5" r="1.7" fill="#160d24"/>
    <circle cx="55.5" cy="23.5" r="1.7" fill="#160d24"/>
    <path class="heart" fill="var(--pink)"
          d="M50 54 C45.5 47.5 32 49.5 32 59 C32 68 50 76 50 76 C50 76 68 68 68 59 C68 49.5 54.5 47.5 50 54 Z"/>
  </svg>

  <svg class="spider wanderer s3" viewBox="0 0 100 78" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g stroke="var(--purple-dark)" stroke-width="3.2" fill="none" stroke-linecap="round">
      <path class="leg"  d="M35 34 L14 14"/>
      <path class="leg2" d="M34 40 L8 40"/>
      <path class="leg"  d="M35 46 L14 64"/>
      <path class="leg2" d="M65 34 L86 14"/>
      <path class="leg"  d="M66 40 L92 40"/>
      <path class="leg2" d="M65 46 L86 64"/>
    </g>
    <ellipse cx="50" cy="43" rx="21" ry="17" fill="var(--body-fill)"/>
    <circle cx="50" cy="23" r="13.5" fill="var(--head-fill)"/>
    <path d="M39 12 L36 4 M45.5 9.5 L44.5 1.5 M54.5 9.5 L55.5 1.5 M61 12 L64 4"
          stroke="var(--purple-dark)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="44.5" cy="22.5" r="3.4" fill="#fff"/>
    <circle cx="55.5" cy="22.5" r="3.4" fill="#fff"/>
    <circle cx="44.5" cy="23.5" r="1.7" fill="#160d24"/>
    <circle cx="55.5" cy="23.5" r="1.7" fill="#160d24"/>
    <path class="heart" fill="var(--pink)"
          d="M50 54 C45.5 47.5 32 49.5 32 59 C32 68 50 76 50 76 C50 76 68 68 68 59 C68 49.5 54.5 47.5 50 54 Z"/>
  </svg>

  <script>
    // Lógica del botón de saludo
    var stage = document.querySelector('.stage');
    var greeting = document.getElementById('greeting');
    document.getElementById('greetBtn').addEventListener('click', function(){
      stage.classList.add('said');
      setTimeout(function(){ greeting.classList.add('flicker'); }, 550);
    });

    // Lógica de Movimiento Aleatorio para las Arañas de fondo (JS)
    const spiders = document.querySelectorAll('.spider.wanderer');
    const spiderData = Array.from(spiders).map(spider => {
      return {
        el: spider,
        x: Math.random() * (window.innerWidth - 60),
        y: Math.random() * (window.innerHeight - 60),
        angle: Math.random() * Math.PI * 2,
        speed: 0.8 + Math.random() * 1.2
      };
    });

    function moveSpiders() {
      spiderData.forEach(s => {
        s.angle += (Math.random() - 0.5) * 0.15;
        let nextX = s.x + Math.cos(s.angle) * s.speed;
        let nextY = s.y + Math.sin(s.angle) * s.speed;
        const margin = 50; 
        if (nextX < -margin || nextX > window.innerWidth + margin) {
          s.angle = Math.PI - s.angle; 
        }
        if (nextY < -margin || nextY > window.innerHeight + margin) {
          s.angle = -s.angle; 
        }
        s.x += Math.cos(s.angle) * s.speed;
        s.y += Math.sin(s.angle) * s.speed;
        const deg = (s.angle * 180 / Math.PI) + 90;
        s.el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${deg}deg)`;
      });
      requestAnimationFrame(moveSpiders);
    }
    
    moveSpiders();
  </script>

</body>
</html>
